name: Train, validate and publish Mushroom

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - 'Final/config/**'
      - 'Final/requirements-training.txt'
      - 'MushroomFinal/mushroom_project_dataset.csv'
      - '.github/workflows/model-training.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mushroom-training-main
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Final/requirements-training.txt
      - run: python -m pip install -r Final/requirements-training.txt
      - name: Fit five training folds, apply quality gates, refit and export
        run: python Final/tools/model_workflow.py train --output candidate
      - uses: actions/upload-artifact@v4
        with:
          name: mushroom-candidate
          path: candidate/
          retention-days: 30

  verify-serving:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mushroom-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python Final/tools/promote_candidate.py candidate
      - run: python frontend/export_metadata.py
      - name: Test both hosted models and candidate references in serving runtime
        run: python -m unittest discover -s tests -v
      - run: node --test tests/test_api_client.cjs tests/test_api_config.cjs tests/test_citibike_frontend.cjs tests/test_mushroom_frontend.cjs

  publish:
    needs: verify-serving
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Refuse to overwrite work pushed while training
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: mushroom-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python Final/tools/promote_candidate.py candidate
      - run: python frontend/export_metadata.py
      - name: Commit validated artifacts; existing hosts follow main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Final/Mushroom/artifacts/current_pipeline.joblib Final/Mushroom/artifacts/training_run.json backend/artifacts/mushroom_rf300.npz backend/artifacts/mushroom_rf300.json backend/artifacts/mushroom_export_audit.json backend/artifacts/mushroom_reference_predictions.csv frontend/metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated Mushroom refit"
          git push origin HEAD:main
